# See: https://github.com/10up/action-wordpress-plugin-asset-update
#
# Pushes only the readme and the WordPress.org assets to SVN, between
# releases; the code itself goes out with a tag (deploy.yml).
#
# The action refuses to deploy whenever anything else in trunk differs from
# the repository, which is every push to main that has unreleased code on it,
# and dist/ is never in the checkout because it is built on release. So the
# job only runs when the readme or the assets changed, and IGNORE_OTHER_FILES
# has it push those while it leaves the rest of trunk to the next release.
#
# A push that changes the Stable tag is a release, not a readme fix. Sent
# ahead of the tag, that readme would point WordPress.org at a tag that is not
# in SVN yet, so it is left to deploy.yml, which sends the readme with the tag.
name: Plugin asset/readme update
on:
  push:
    branches:
      - main
    paths:
      - readme.txt
      - .wordpress-org/**

permissions:
  contents: read

jobs:
  trunk:
    name: Push to main
    runs-on: ubuntu-latest
    # The same approval and credentials as a release, see deploy.yml.
    environment: wordpress-org
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Leave a release to the tag
        id: release
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git diff "$BEFORE" HEAD -- readme.txt | grep -qE '^[-+]Stable tag:'; then
            echo "The Stable tag changes, so the readme goes out with the tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Whoever pushed to main sends the readme with their own SVN account when
      # SVN_<LOGIN>_USERNAME and SVN_<LOGIN>_PASSWORD are set, and with the
      # company account otherwise. See .github/scripts/svn-account.sh.
      - name: Find the pusher's SVN secrets
        id: who
        if: steps.release.outputs.skip != 'true'
        env:
          LOGIN: ${{ github.actor }}
        run: .github/scripts/svn-account.sh key "$LOGIN"

      - name: Choose personal or company SVN credentials
        id: svn
        if: steps.release.outputs.skip != 'true'
        env:
          KEY: ${{ steps.who.outputs.key }}
          PERSONAL_USERNAME: ${{ secrets[format('SVN_{0}_USERNAME', steps.who.outputs.key)] }}
          PERSONAL_PASSWORD: ${{ secrets[format('SVN_{0}_PASSWORD', steps.who.outputs.key)] }}
          COMPANY_USERNAME: ${{ secrets.SVN_USERNAME }}
          COMPANY_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: .github/scripts/svn-account.sh choose

      - name: WordPress.org plugin asset/readme update
        if: steps.release.outputs.skip != 'true'
        # Pinned to a commit: it is handed the SVN credentials. 2.2.0.
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7
        env:
          SVN_PASSWORD: ${{ steps.svn.outputs.variant == 'personal' && secrets[format('SVN_{0}_PASSWORD', steps.who.outputs.key)] || secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ steps.svn.outputs.variant == 'personal' && secrets[format('SVN_{0}_USERNAME', steps.who.outputs.key)] || secrets.SVN_USERNAME }}
          IGNORE_OTHER_FILES: true
