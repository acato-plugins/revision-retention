# See: https://github.com/10up/action-wordpress-plugin-deploy
#
# The settings screen's script and stylesheet are built by Vite into dist/,
# which is not in the repository, so the job builds them first. What ships is
# the checkout plus that build, minus whatever .distignore excludes. The
# sources in src/ ship too, so the minified files can be read and rebuilt.
#
# Publishing reaches every site that installs or updates the plugin, so the
# job runs in the wordpress-org environment, which holds the SVN credentials
# and asks a release manager to approve each run. The tagged commit brings its
# own copy of this file, so that approval, and a ruleset on who may create
# tags, are what really guard a release; the check that the commit is on main
# is a second line behind them.
name: Deploy to WordPress.org
on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    environment: wordpress-org
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Only release what is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main, so it is not released."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what package-lock.json says, and nothing
      # else will do for a release: should it fail, the job fails, rather than
      # ship a build made with whatever versions resolve that day.
      - name: Install build tools
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build assets
        run: npm run build

      - name: WordPress Plugin Deploy
        # Pinned to a commit: it is handed the SVN credentials. 2.3.0.
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
