# See: https://github.com/10up/action-wordpress-plugin-deploy
#
# The settings screen's script and stylesheet are built by Vite into dist/,
# which is not in the repository, so the job builds them first. What ships is
# the checkout plus that build, minus whatever .distignore excludes. The
# sources in src/ ship too, so the minified files can be read and rebuilt.
name: Deploy to WordPress.org
on:
  push:
    tags:
      - "*"
jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what package-lock.json says. Should that fail,
      # a plain install is the fallback, so a release is not held up by it.
      - name: Install build tools
        run: npm ci --prefer-offline --no-audit --fund=false || npm i --prefer-offline --no-audit --fund=false

      - name: Build assets
        run: npm run build

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
