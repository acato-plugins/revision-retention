# See: https://github.com/WordPress/plugin-check-action
#
# The checkout contains the whole repository, while WordPress.org only ever
# receives what .distignore lets through. The exclusions below keep the two in
# step, so this job checks the same file set that actually ships.
name: Plugin Check
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  plugin-check:
    name: Run Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # dist/ is not in the repository; check what the deploy would build.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what package-lock.json says. Should that fail,
      # a plain install is the fallback, so a release is not held up by it.
      - name: Install build tools
        run: npm ci --prefer-offline --no-audit --fund=false || npm i --prefer-offline --no-audit --fund=false

      - name: Build assets
        run: npm run build

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: "./"
          exclude-directories: ".github,.idea,.phpstan,.wordpress-org,node_modules,tests,vendor"
          exclude-files: ".distignore,.editorconfig,.gitattributes,.gitignore,.nvmrc,composer.json,composer.lock,package.json,package-lock.json,phpcs.xml.dist,phpstan.neon,vite.config.js"
