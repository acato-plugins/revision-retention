# Checks the WordPress.org SVN credentials of one contributor, without
# releasing anything: it says whether their release would use their personal
# account (SVN_<LOGIN>_USERNAME/PASSWORD) or the company one
# (SVN_USERNAME/PASSWORD), and whether each account that is set can log in and
# commit to the plugin. See .github/scripts/svn-account.sh.
#
# The secrets live in the wordpress-org environment, so a run waits for the
# same approval as a release.
name: Check SVN credentials
on:
  workflow_dispatch:
    inputs:
      contributor:
        description: "GitHub login to check (empty: yourself)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Check SVN credentials
    runs-on: ubuntu-latest
    environment: wordpress-org
    env:
      SLUG: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Find the contributor's SVN secrets
        id: who
        env:
          LOGIN: ${{ inputs.contributor || github.actor }}
        run: .github/scripts/svn-account.sh key "$LOGIN"

      - name: Choose personal or company SVN credentials
        id: svn
        env:
          KEY: ${{ steps.who.outputs.key }}
          PERSONAL_USERNAME: ${{ secrets[format('SVN_{0}_USERNAME', steps.who.outputs.key)] }}
          PERSONAL_PASSWORD: ${{ secrets[format('SVN_{0}_PASSWORD', steps.who.outputs.key)] }}
          COMPANY_USERNAME: ${{ secrets.SVN_USERNAME }}
          COMPANY_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: .github/scripts/svn-account.sh choose

      - name: Check the personal credentials
        id: personal
        if: steps.svn.outputs.variant == 'personal'
        continue-on-error: true
        env:
          SVN_USERNAME: ${{ secrets[format('SVN_{0}_USERNAME', steps.who.outputs.key)] }}
          SVN_PASSWORD: ${{ secrets[format('SVN_{0}_PASSWORD', steps.who.outputs.key)] }}
        run: .github/scripts/svn-account.sh probe "$SLUG"

      # Checked either way: it is what everyone without a personal account
      # releases with.
      - name: Check the company credentials
        id: company
        if: ${{ !cancelled() && steps.svn.outputs.company == 'set' }}
        continue-on-error: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: .github/scripts/svn-account.sh probe "$SLUG"

      - name: Summarise
        if: ${{ !cancelled() && steps.svn.outcome == 'success' }}
        env:
          LOGIN: ${{ inputs.contributor || github.actor }}
          KEY: ${{ steps.who.outputs.key }}
          VARIANT: ${{ steps.svn.outputs.variant }}
          PERSONAL: ${{ steps.personal.outcome }}
          COMPANY: ${{ steps.company.outcome }}
        run: |
          result() {
            case "$1" in
              success) echo "✅ can log in and commit to $SLUG" ;;
              failure) echo "❌ failed, see the step's log" ;;
              *) echo "not set" ;;
            esac
          }
          {
            echo "### SVN credentials for \`$LOGIN\`"
            echo
            echo "A release by \`$LOGIN\` uses the **$VARIANT** credentials."
            echo
            echo "| Credentials | Secrets | Result |"
            echo "| --- | --- | --- |"
            echo "| Personal | \`SVN_${KEY}_USERNAME\`, \`SVN_${KEY}_PASSWORD\` | $(result "$PERSONAL") |"
            echo "| Company | \`SVN_USERNAME\`, \`SVN_PASSWORD\` | $(result "$COMPANY") |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Fail the run when the credentials a release would use do not work.
          if [ "$VARIANT" = personal ] && [ "$PERSONAL" != success ]; then exit 1; fi
          if [ "$VARIANT" = company ] && [ "$COMPANY" != success ]; then exit 1; fi
